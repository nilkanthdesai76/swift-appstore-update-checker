<svg width="1000" height="280" viewBox="0 0 1000 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="upbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="280" rx="16" fill="url(#upbg)" stroke="#334155"/>

  <!-- Left: Service Flow -->
  <g transform="translate(60, 45)">
    <rect width="250" height="190" rx="12" fill="url(#alertGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="125" y="32" font-family="-apple-system, sans-serif" font-size="16" fill="#38bdf8" font-weight="700" text-anchor="middle">📡 AppStoreLookupService</text>
    <line x1="20" y1="46" x2="230" y2="46" stroke="#334155"/>
    <text x="25" y="75" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">1. Query iTunes Search API</text>
    <text x="25" y="100" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">2. Parse SemanticVersion</text>
    <text x="25" y="125" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">3. Compare: 1.0.0 &lt; 1.2.0</text>
    <text x="25" y="155" font-family="-apple-system, sans-serif" font-size="12" fill="#4ade80" font-weight="600">✓ isUpdateAvailable: true</text>
  </g>

  <!-- Flow Arrow -->
  <path d="M 320 140 L 400 140" stroke="#818cf8" stroke-width="3" stroke-dasharray="6 6"/>
  <polygon points="405,140 395,134 395,146" fill="#818cf8"/>

  <!-- Center: Modal Mockup -->
  <g transform="translate(420, 30)">
    <rect width="280" height="220" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="140" y="40" font-family="-apple-system, sans-serif" font-size="17" fill="#f8fafc" font-weight="700" text-anchor="middle">Update Available</text>
    <text x="140" y="65" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Version 1.2.0 is now live on the</text>
    <text x="140" y="83" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">App Store (installed: 1.0.0).</text>

    <rect x="25" y="102" width="230" height="42" rx="8" fill="#0f172a"/>
    <text x="35" y="120" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">What's New:</text>
    <text x="35" y="134" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">• Liquid UI &amp; performance polish</text>

    <!-- Buttons -->
    <rect x="25" y="160" width="105" height="38" rx="8" fill="#334155"/>
    <text x="77" y="184" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1" font-weight="600" text-anchor="middle">Later</text>

    <rect x="150" y="160" width="105" height="38" rx="8" fill="#4f46e5"/>
    <text x="202" y="184" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">Update Now</text>
  </g>

  <!-- Right: Value Props -->
  <g transform="translate(730, 65)">
    <text x="0" y="25" font-family="-apple-system, sans-serif" font-size="15" fill="#38bdf8" font-weight="700">🔒 Zero SDK Tracking</text>
    <text x="0" y="45" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Direct official Apple iTunes endpoint.</text>

    <text x="0" y="85" font-family="-apple-system, sans-serif" font-size="15" fill="#c084fc" font-weight="700">⚡ SwiftUI Native Modifier</text>
    <text x="0" y="105" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Attach with `.appStoreUpdateAlert()`.</text>

    <text x="0" y="145" font-family="-apple-system, sans-serif" font-size="15" fill="#4ade80" font-weight="700">🍏 iOS &amp; macOS Ready</text>
  </g>
</svg>
